name: Validate reviewed network
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 scripts/build_search_index.py --release 20260811-network-2
      - run: git diff --exit-code -- natverk-index.json sok-index.json
      - run: node scripts/validate-network.cjs
      - run: node --test
