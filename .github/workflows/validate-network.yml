name: Validate reviewed network
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/build_search_index.py
      - run: git diff --exit-code -- natverk-index.json sok-index.json
      - run: python3 scripts/build_landing_search.py
      - run: git diff --exit-code -- landing-search-index.json docs/search-index-audit.json
      - run: python3 scripts/inject-favicon.py
      - run: node scripts/validate-network.cjs
      - run: python3 scripts/audit_article_links.py --check-baseline
      - run: node --test
