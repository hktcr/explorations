<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<script src="../explorations-theme.js?v=20261122-theme-1"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fcfcfc">
<title>Innehållsförteckning · Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../natverk.css?v=20261109-teaching-1&amp;ui=20261124-format-1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg?v=20261025-1" data-explorations-favicon="svg">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=20261025-1" data-explorations-favicon="png">
<link rel="shortcut icon" href="../favicon.ico?v=20261025-1" data-explorations-favicon="ico">
<link rel="stylesheet" href="../explorations-theme.css?v=20261122-theme-1">
<link rel="stylesheet" href="innehall.css">
</head><body class="contents-page">
<header class="natverk-huvud">
  <a class="natverk-stang" href="../" aria-label="Tillbaka till Explorations">← Explorations</a>
  <h1>Innehållsförteckning</h1>
  <div class="natverk-huvud-actions"><span data-xr-theme-slot></span></div>
</header>
<main>
<form id="filters" role="search" aria-label="Sök i innehållsförteckningen" hidden>
  <label class="search-label">Sök titel eller ämne<input id="query" type="search"></label>
  <label>Format<select id="format"><option value="">Alla delar</option><!-- formats --></select></label>
  <label>Ämne<select id="subject"><option value="">Alla ämnen</option><!-- topics --></select></label>
  <label>Sortera<select id="sort"><option value="recent">Senast publicerad</option><option value="title">Titel A–Ö</option></select></label>
</form>
<p id="count" role="status" aria-live="polite"></p>
<ul id="entries"><!-- entries --></ul>
</main><script>
const form = document.querySelector('#filters');
const list = document.querySelector('#entries');
const count = document.querySelector('#count');
const byTitle = new Intl.Collator('sv', {sensitivity: 'base', numeric: true});
const normalize = value => value.toLocaleLowerCase('sv').normalize('NFC');
const entries = Array.from(list.children, element => {
  const title = element.querySelector('a').textContent;
  const topics = JSON.parse(element.dataset.topics);
  return {element, title, topics, search: normalize([title, ...topics, element.dataset.keywords].join(' '))};
});
const alphabetical = [...entries].sort((a, b) => byTitle.compare(a.title, b.title));
function filter() {
  const words = normalize(form.elements.query.value.trim()).split(/\s+/).filter(Boolean);
  let visible = 0;
  for (const {element, topics, search} of entries) {
    element.hidden = (form.elements.format.value && element.dataset.format !== form.elements.format.value)
      || (form.elements.subject.value && !topics.includes(form.elements.subject.value))
      || !words.every(word => search.includes(word));
    if (!element.hidden) visible++;
  }
  count.textContent = visible ? visible + (visible === 1 ? ' träff' : ' träffar') : 'Inga träffar. Byt ämne eller format, eller ändra sökningen.';
}
function sortAndFilter() {
  const rows = form.elements.sort.value === 'title' ? alphabetical : entries;
  list.replaceChildren(...rows.map(row => row.element));
  filter();
}
form.addEventListener('submit', event => event.preventDefault());
form.addEventListener('input', filter);
form.addEventListener('change', event => event.target.id === 'sort' ? sortAndFilter() : filter());
window.addEventListener('pageshow', sortAndFilter);
sortAndFilter();
form.hidden = false;
</script></body></html>
